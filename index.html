<title>今日の献立</title>

<style>
  :root{
    --wall:#EFE6D6;     /* 壁 */
    --ink:#2A2521;      /* 墨 */
    --sub:#7A6550;      /* うすい茶 */
    --wood-dark:#8A6440;
    --sign:#553A23;     /* 看板のこげ茶 */
    --shu:#B0412E;      /* 朱 */
    --paper:#FFFBF2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{color-scheme:light;-webkit-text-size-adjust:100%;}
  body{
    min-height:100dvh;color:var(--ink);line-height:1.6;
    background:
      repeating-linear-gradient(0deg, rgba(138,100,64,.035) 0 1px, transparent 1px 6px),
      var(--wall);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  }
  .mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;}
  .wrap{max-width:440px;margin:0 auto;padding:22px 18px 48px;}
  button{font:inherit;color:inherit;}

  /* 看板 */
  .sign{
    position:relative;text-align:center;color:#F7EBD3;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 9px),
      linear-gradient(180deg,#6B4A2E,var(--sign));
    border-radius:6px;padding:12px 10px 13px;
    box-shadow:0 3px 0 #3E2A18, 0 8px 16px rgba(62,42,24,.18);
  }
  .sign h1{font-size:25px;font-weight:800;letter-spacing:.32em;text-indent:.32em;}
  .sign::before,.sign::after{
    content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
    background:#C9A66B;box-shadow:inset 0 -1px 0 rgba(0,0,0,.4);
  }
  .sign::before{left:10px;} .sign::after{right:10px;}
  .date{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;letter-spacing:.1em;}

  .q{text-align:center;font-size:14px;color:var(--sub);margin:18px 0 0;letter-spacing:.08em;}

  /* 木札 */
  .boards{display:flex;justify-content:center;align-items:flex-start;gap:22px;margin-top:40px;}
  .plaque{
    position:relative;display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:6px;
    min-width:96px;height:290px;padding:18px 12px;cursor:pointer;text-align:left;
    background:
      repeating-linear-gradient(90deg, rgba(110,70,30,.07) 0 2px, transparent 2px 8px),
      linear-gradient(90deg,#D3AF7F,#E6CB9F 45%,#DCBB8C 70%,#CCA676);
    border:2px solid var(--wood-dark);border-radius:6px;
    box-shadow:0 4px 0 var(--wood-dark), 0 12px 18px rgba(90,60,30,.16);
    transform-origin:50% -30px;
  }
  /* 吊るしひもと釘 */
  .plaque::before{content:"";position:absolute;left:50%;top:-30px;width:2px;height:30px;margin-left:-1px;background:var(--wood-dark);}
  .plaque::after{content:"";position:absolute;left:50%;top:-36px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#4A3524;}
  .plaque:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-dark), 0 6px 10px rgba(90,60,30,.16);}
  .plaque.small{height:240px;min-width:84px;margin-top:46px;}
  .v{writing-mode:vertical-rl;text-orientation:upright;}
  .plaque .tag{font-size:12px;font-weight:700;color:var(--shu);letter-spacing:.25em;}
  .plaque .name{font-size:32px;font-weight:800;letter-spacing:.1em;line-height:1.2;max-height:100%;}
  .plaque .note{font-size:12px;color:var(--sub);letter-spacing:.08em;margin-top:auto;}
  .tcy{text-combine-upright:all;-webkit-text-combine:horizontal;}

  .plaque.spinning{animation:swing .45s ease-in-out infinite alternate;}
  .plaque.spinning .name{color:#9C8164;white-space:nowrap;overflow:hidden;}
  .plaque.appear{animation:settle .9s ease-out;}
  @keyframes swing{from{transform:rotate(-3deg);}to{transform:rotate(3deg);}}
  @keyframes settle{0%{transform:rotate(4deg);}35%{transform:rotate(-2.5deg);}65%{transform:rotate(1.2deg);}100%{transform:rotate(0);}}

  /* まだ決めていない副菜の札（点線） */
  .plaque.empty{
    background:rgba(255,251,242,.5);border:2px dashed #B79C7A;box-shadow:none;
  }
  .plaque.empty .name{font-size:20px;color:var(--sub);font-weight:700;}
  .plaque.empty::before{background:#B79C7A;}
  .plaque:disabled{cursor:default;}

  /* 材料メモ */
  .memo{
    margin-top:26px;background:var(--paper);border:1px solid #D8C6A6;border-radius:4px;
    padding:12px 14px;font-size:13px;color:var(--sub);
  }
  .memo p + p{margin-top:6px;padding-top:6px;border-top:1px dashed #E2D4BC;}
  .memo b{color:var(--ink);font-weight:700;margin-right:.5em;}

  /* ボタン */
  .btns{display:flex;gap:10px;margin-top:22px;}
  .btn{
    flex:1;padding:13px 6px;border-radius:4px;font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer;
    background:var(--ink);color:#F7EBD3;border:1px solid var(--ink);
  }
  .btn.line{background:transparent;color:var(--ink);}
  .btn:active{opacity:.8;}
  .btn:disabled{opacity:.35;cursor:default;}
  .text-btn{
    background:none;border:0;cursor:pointer;padding:6px 0;font-size:13px;color:var(--sub);
    text-decoration:underline;text-underline-offset:4px;
  }
  .links{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}

  /* 最近の記録 */
  .recent{margin-top:34px;background:var(--paper);border:1px solid #D8C6A6;border-radius:4px;padding:12px 14px;font-size:12px;color:var(--sub);}
  .recent h2{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.1em;margin-bottom:4px;}
  .recent b{color:var(--ink);margin-right:.5em;}
  .recent .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  :focus-visible{outline:2px solid var(--shu);outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){.plaque.spinning,.plaque.appear{animation:none;}}
</style>

<main class="wrap">
  <header>
    <div class="sign"><h1 class="mincho">今日の献立</h1></div>
    <p class="date" id="date"></p>
  </header>
  <div id="app"></div>
  <p class="sr" aria-live="polite" id="live"></p>
</main>

<script>
  const SPIN_MS = 1300;      // スロットが回る時間（ミリ秒）
  const TICK_MS = 70;        // 料理名が切り替わる速さ
  const RECENT_MAX = 5;      // 最近決まった料理を何品まで避けるか
  const STORE_KEY = "kondate-recent-v1";

  // 今日の日付（例：11月25日（水））
  (function(){
    const d = new Date();
    document.getElementById("date").textContent =
      `${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
  })();

  // ---- 最近決まった料理の記録（このスマホの中だけに保存） ----
  function loadRecent(){
    try{
      const r = JSON.parse(localStorage.getItem(STORE_KEY));
      if(r && Array.isArray(r.main) && Array.isArray(r.side)) return r;
    }catch(e){}
    return {main:[], side:[]};
  }
  function saveRecent(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(recent)); }catch(e){}
  }
  let recent = loadRecent();
  // 今回アプリを開いてから出た料理（引き直しで同じものが戻ってこないように）
  const sessionSeen = {main:[], side:[]};
  // 今回アプリを開いてから記録した料理（引き直したら記録を差し替える）
  const sessionEntry = {main:null, side:null};

  function remember(kind, name){
    const prev = sessionEntry[kind];
    recent[kind] = [name, ...recent[kind].filter(n => n !== name && n !== prev)].slice(0, RECENT_MAX);
    sessionEntry[kind] = name;
    sessionSeen[kind].push(name);
    saveRecent();
  }
  function clearRecent(){
    if(!confirm("最近決まった料理の記録を消しますか？")) return;
    recent = {main:[], side:[]};
    sessionEntry.main = sessionEntry.side = null;
    saveRecent();
    render();
  }

  // 状態
  function freshState(){
    return {
      screen: "start",     // start / mode / result
      category: null,      // main / side
      mode: null,          // 普通 / 手抜き / null
      mainName: null, mainSpin: false,
      sideName: null, sideSpin: false, sideOpen: false,
      ing: false,          // 材料を表示中か
    };
  }
  let state = freshState();
  let spinTimers = [];
  const fresh = {main:false, side:false}; // 決まった直後だけ札をゆらす

  function clearSpin(){ spinTimers.forEach(clearInterval); spinTimers.forEach(clearTimeout); spinTimers=[]; }

  // モードに応じた候補プール
  function poolFor(category, mode){
    if(category === "side") return SIDES;
    if(mode === "手抜き") return MAIN_LAZY;
    return MAIN_LAZY.concat(MAIN_NORMAL); // 普通 = 全主菜
  }
  // 最近出たものを避けて引く（候補がなくなったら少しずつゆるめる）
  function pick(kind, pool, current){
    const avoid = new Set([...recent[kind], ...sessionSeen[kind]]);
    let c = pool.filter(n => n !== current && !avoid.has(n));
    if(!c.length) c = pool.filter(n => n !== current && !recent[kind].includes(n));
    if(!c.length) c = pool.filter(n => n !== current);
    if(!c.length) c = pool;
    return c.length ? c[Math.floor(Math.random()*c.length)] : null;
  }

  // スロットを回して確定
  function spin(kind){ // kind: "main" | "side"
    const pool = kind==="main" ? poolFor("main", state.mode) : poolFor("side", null);
    const current = kind==="main" ? state.mainName : state.sideName;
    const chosen = pick(kind, pool, current);

    if(kind==="main"){ state.mainSpin=true; } else { state.sideSpin=true; state.sideOpen=true; }
    render();

    const slotEl = document.getElementById(kind+"-slot");
    const iv = setInterval(()=>{
      if(slotEl) slotEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    }, TICK_MS);
    spinTimers.push(iv);

    const to = setTimeout(()=>{
      clearInterval(iv);
      if(kind==="main"){ state.mainName=chosen; state.mainSpin=false; }
      else { state.sideName=chosen; state.sideSpin=false; }
      if(chosen) remember(kind, chosen);
      fresh[kind] = true;
      render();
      document.getElementById("live").textContent = (kind==="main" ? "主菜は" : "副菜は") + chosen;
    }, SPIN_MS);
    spinTimers.push(to);
  }

  const busy = ()=> state.mainSpin || state.sideSpin;

  // 操作
  function chooseCategory(cat){
    state.category = cat;
    if(cat==="side"){
      state.mode=null; state.screen="result";
      state.mainName=null; state.sideOpen=true;
      render(); spin("side");
    } else {
      state.screen="mode"; render();
    }
  }
  function chooseMode(md){
    state.mode=md; state.screen="result";
    state.sideOpen=false; state.sideName=null;
    render(); spin("main");
  }
  function rerollMain(){ if(!busy()) spin("main"); }
  function rollSide(){ if(!busy()) spin("side"); }
  function toggleIng(){ state.ing = !state.ing; render(); }
  function reset(){ clearSpin(); state = freshState(); render(); }

  // 数字を縦書きの中で横並びにする（例：54）
  const tcy = n => `<span class="tcy">${n}</span>`;

  // 札の文字の大きさと札の長さ（長い料理名は札を長く・文字を小さくして1列に収める）
  function fitPlaque(name, base, minH, maxH){
    if(!name) return {size: base, height: minH};
    const per = 1.12; // 1文字ぶんの高さ（字間こみ）
    let size = base;
    if(name.length * size * per + 44 > maxH) size = Math.max(18, Math.floor((maxH - 44) / (name.length * per)));
    const height = Math.max(minH, Math.min(maxH, Math.ceil(name.length * size * per + 44)));
    return {size, height};
  }

  // 料理の札（主菜・副菜共通）
  function dishPlaque(kind, opts){
    const name = kind==="main" ? state.mainName : state.sideName;
    const spinning = kind==="main" ? state.mainSpin : state.sideSpin;
    const small = !!opts.small;
    const minH = small ? 240 : 290, maxH = small ? 320 : 340;
    const {size, height} = spinning ? {size: small ? 24 : 30, height: minH} : fitPlaque(name, small ? 28 : 34, minH, maxH);
    const cls = "plaque" + (small ? " small" : "") + (spinning ? " spinning" : "") + (fresh[kind] ? " appear" : "");
    const tag = kind==="main" ? "主菜" + (state.mode ? "・" + state.mode : "") : "副菜";
    const action = kind==="main" ? "rerollMain()" : "rollSide()";
    return `
      <button class="${cls}" style="height:${height}px" onclick="${action}" ${busy()?"disabled":""} aria-label="${tag} ${name ?? ""}（押すと引き直し）">
        <span class="v tag">${tag}</span>
        <span class="v name mincho" id="${kind}-slot" style="font-size:${size}px">${name ?? "…"}</span>
      </button>`;
  }

  // 画面描画
  function render(){
    const app = document.getElementById("app");
    const s = state;

    if(s.screen==="start"){
      const hasRecent = recent.main.length || recent.side.length;
      app.innerHTML = `
        <p class="q">どっちを決める？ 札を押してね</p>
        <div class="boards">
          <button class="plaque" onclick="chooseCategory('side')">
            <span class="v tag">副菜</span>
            <span class="v name mincho" style="font-size:30px">副菜をきめる</span>
            <span class="v note">${tcy(SIDES.length)}品から</span>
          </button>
          <button class="plaque" onclick="chooseCategory('main')">
            <span class="v tag">主菜</span>
            <span class="v name mincho" style="font-size:30px">主菜をきめる</span>
            <span class="v note">普通・手抜き</span>
          </button>
        </div>
        ${hasRecent ? `
          <section class="recent">
            <h2>最近決まった料理</h2>
            ${recent.main.length ? `<p><b>主菜</b>${recent.main.join("・")}</p>` : ""}
            ${recent.side.length ? `<p><b>副菜</b>${recent.side.join("・")}</p>` : ""}
            <div class="foot"><span>しばらく出にくくなっています</span>
              <button class="text-btn" onclick="clearRecent()">記録を消す</button></div>
          </section>` : ""}
      `;
      return;
    }

    if(s.screen==="mode"){
      const lazyN = poolFor("main","手抜き").length;
      const allN = poolFor("main","普通").length;
      app.innerHTML = `
        <p class="q">今日はどっちの気分？</p>
        <div class="boards">
          <button class="plaque" onclick="chooseMode('手抜き')">
            <span class="v tag">疲れた日</span>
            <span class="v name mincho" style="font-size:34px">手抜き</span>
            <span class="v note">${tcy(lazyN)}品から</span>
          </button>
          <button class="plaque" onclick="chooseMode('普通')">
            <span class="v tag">ちゃんと作る</span>
            <span class="v name mincho" style="font-size:34px">普通</span>
            <span class="v note">${tcy(allN)}品から</span>
          </button>
        </div>
        <div class="links"><button class="text-btn" onclick="reset()">← もどる</button></div>
      `;
      return;
    }

    // result（縦書きなので、主菜を右・副菜を左に並べる）
    let boards = "";
    if(s.category==="main"){
      boards += s.sideOpen
        ? dishPlaque("side", {small:true})
        : `<button class="plaque small empty" onclick="rollSide()" ${busy()?"disabled":""}>
             <span class="v name mincho">＋副菜もきめる</span>
           </button>`;
      boards += dishPlaque("main", {});
    } else {
      boards += dishPlaque("side", {});
    }

    const done = (s.category==="main" && s.mainName && !s.mainSpin) || (s.category==="side" && s.sideName && !s.sideSpin);
    const ingLine = (label, name) => name ? `<p><b>${label}　${name}</b>${(INGREDIENTS[name] || ["（材料未登録）"]).join("・")}</p>` : "";
    const memo = s.ing && done ? `
      <div class="memo">
        ${s.category==="main" ? ingLine("主菜", s.mainSpin ? null : s.mainName) : ""}
        ${s.sideOpen ? ingLine("副菜", s.sideSpin ? null : s.sideName) : ""}
      </div>` : "";

    const btns = s.category==="main"
      ? `<button class="btn" onclick="rerollMain()" ${busy()?"disabled":""}>主菜を引き直す</button>
         ${s.sideOpen ? `<button class="btn line" onclick="rollSide()" ${busy()?"disabled":""}>副菜を引き直す</button>` : ""}`
      : `<button class="btn" onclick="rollSide()" ${busy()?"disabled":""}>引き直す</button>`;

    app.innerHTML = `
      <div class="boards">${boards}</div>
      ${memo}
      <div class="btns">${btns}</div>
      <div class="links">
        <button class="text-btn" onclick="reset()">← 最初にもどる</button>
        ${done ? `<button class="text-btn" onclick="toggleIng()" aria-expanded="${s.ing}">${s.ing ? "材料を閉じる" : "材料を見る"}</button>` : ""}
      </div>
    `;
    fresh.main = fresh.side = false;
  }

  render();
</script>
</body>
